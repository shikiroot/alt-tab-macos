name: Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

env:
  APP_NAME: AltTab
  BUILD_DIR: ${{ github.workspace }}
  XCODE_BUILD_PATH: DerivedData/Build/Products/Release

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

      - name: Import certificate
        if: env.P12_CERTIFICATE != ''
        env:
          P12_CERTIFICATE: ${{ secrets.P12_CERTIFICATE }}
        run: |
          echo "$P12_CERTIFICATE" | base64 --decode > /tmp/codesign.p12
          security create-keychain -p runner /tmp/build.keychain
          security unlock-keychain -p runner /tmp/build.keychain
          security import /tmp/codesign.p12 -k /tmp/build.keychain -P 123456 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k runner /tmp/build.keychain
          security list-keychains -d user -s /tmp/build.keychain login.keychain-db
          echo "CODE_SIGN_IDENTITY=AltTab Self-Signed" >> $GITHUB_ENV

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(git describe --tags --always --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")"
            VERSION="${VERSION}-${GITHUB_SHA::7}"
          fi
          echo "$VERSION" > VERSION.txt
          echo "Building version: $VERSION"

      - name: Create local.xcconfig
        run: |
          cat > config/local.xcconfig <<EOF
          CURRENT_PROJECT_VERSION = $(cat VERSION.txt)
          APPCENTER_SECRET =
          CODE_SIGN_IDENTITY = ${CODE_SIGN_IDENTITY:--}
          EOF

      - run: scripts/build_app.sh

      - name: Package app
        run: |
          cd "$XCODE_BUILD_PATH"
          ditto -c -k --keepParent "$APP_NAME.app" "$APP_NAME.zip"

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ github.sha }}
          path: ${{ env.XCODE_BUILD_PATH }}/${{ env.APP_NAME }}.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.XCODE_BUILD_PATH }}/${{ env.APP_NAME }}.zip
